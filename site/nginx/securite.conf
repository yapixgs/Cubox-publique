# En-têtes de sécurité, inclus au niveau `server` ET dans chaque `location` qui
# pose son propre `add_header` : nginx n'hérite des `add_header` du niveau
# supérieur que si la location n'en déclare aucun.
#
# Le marqueur de `script-src` est remplacé au build (site/Dockerfile) par
# l'empreinte de l'import map, seul script inline de la page (cloudoxApp()).
# `connect-src 'self'` suffit : grâce au relais /api/releases, la page n'appelle
# jamais d'origine externe. Le socle (/_socle/v1/) est servi sur la même origine
# par l'ingress. `style-src 'unsafe-inline'` comme les autres sites Cloudox :
# Svelte pose des attributs `style` (directives style:).
add_header X-Frame-Options        "SAMEORIGIN"                        always;
add_header X-Content-Type-Options "nosniff"                           always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' @IMPORTMAP_SHA256@; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
