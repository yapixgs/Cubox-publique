# Configuration principale de nginx pour l'image Cubox.
#
# Elle diffère de celle livrée par l'image officielle sur deux points, tous
# deux imposés par l'exécution en utilisateur non privilégié (le namespace du
# cluster applique `pod-security.kubernetes.io/enforce: restricted`, donc
# `runAsNonRoot: true`) :
#
#   1. pas de directive `user` — nginx n'est pas root, il ne peut pas changer
#      d'identité, et la laisser ne produirait qu'un avertissement au
#      démarrage ;
#   2. le PID et les fichiers temporaires vont dans /tmp, seul emplacement
#      inscriptible quand la racine du conteneur est montée en lecture seule
#      (`readOnlyRootFilesystem: true`).

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tous les chemins d'écriture sont déplacés hors de la racine du
    # conteneur, qui est en lecture seule.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Cache du relais vers la forge. Doit être déclaré ici : `proxy_cache_path`
    # n'existe qu'au niveau `http`.
    #   keys_zone  : 1 Mo suffit très largement pour une seule entrée
    #   max_size   : la réponse fait quelques kilo-octets
    #   inactive   : purge si personne ne visite la page pendant une heure
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=forge:1m max_size=16m inactive=1h use_temp_path=off;

    # NOTE — pas de directive `resolver` volontairement.
    # `proxy_pass` pointe sur un nom littéral (pas une variable) : nginx le
    # résout au démarrage via /etc/resolv.conf, sans avoir besoin d'un
    # résolveur déclaré. Coder en dur l'IP de CoreDNS serait une hypothèse que
    # je n'ai pas vérifiée sur ce cluster. Contrepartie assumée : si l'IP de
    # la forge change, il faut redémarrer le pod.

    include /etc/nginx/conf.d/*.conf;
}
