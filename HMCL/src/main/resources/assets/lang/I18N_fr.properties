launch.advice=%s Voulez-vous tout de même poursuivre le lancement ?
launch.advice.multi=Les problèmes suivants ont été détectés :\n\n%s\n\nCes problèmes peuvent empêcher le lancement du jeu ou nuire à l'expérience de jeu.\nVoulez-vous tout de même poursuivre le lancement ?
launch.advice.java.auto=La version actuelle de Java n'est pas compatible avec l'instance.\n\nCliquez sur « Oui » pour choisir automatiquement la version de Java la plus compatible. Vous pouvez également vous rendre dans « Paramètres globaux/spécifiques à l'instance → Java » pour en choisir une vous-même.
launch.advice.java.modded_java_7=Minecraft 1.7.2 et les versions antérieures requièrent Java 7 ou une version antérieure.
launch.advice.cleanroom=Cleanroom %2$s ne peut fonctionner que sur Java %1$s ou version ultérieure. Veuillez utiliser Java %1$s ou une version ultérieure.
launch.advice.corrected=Nous avons résolu le problème lié à Java. Si vous souhaitez tout de même utiliser la version de Java de votre choix, vous pouvez désactiver « Ne pas vérifier la compatibilité de la JVM » dans « Paramètres globaux/spécifiques à l'instance → Paramètres avancés ».
launch.advice.uncorrected=Si vous souhaitez tout de même utiliser la version de Java de votre choix, vous pouvez désactiver « Ne pas vérifier la compatibilité de la JVM » dans « Paramètres globaux/spécifiques à l'instance → Paramètres avancés ».
launch.advice.different_platform=La version 64 bits de Java est recommandée pour votre appareil, mais vous avez installé une version 32 bits.
launch.advice.forge2760_liteloader=La version 2760 de Forge n'est pas compatible avec LiteLoader. Veuillez envisager de mettre à niveau Forge vers la version 2773 ou ultérieure.
launch.advice.forge28_2_2_optifine=La version 28.2.2 de Forge ou ultérieure n'est pas compatible avec OptiFine. Veuillez envisager de rétrograder Forge vers la version 28.2.1 ou antérieure.
launch.advice.forge37_0_60=Les versions de Forge antérieures à 37.0.60 ne sont pas compatibles avec Java 17. Veuillez mettre à jour Forge vers la version 37.0.60 ou ultérieure, ou lancer le jeu avec Java 16.
launch.advice.java8_1_13=Minecraft 1.13 et versions ultérieures ne peuvent fonctionner que sur Java 8 ou version ultérieure. Veuillez utiliser Java 8 ou une version ultérieure.
launch.advice.java8_51_1_13=Minecraft 1.13 peut planter sur les versions de Java 8 antérieures à 1.8.0_51. Veuillez installer la dernière version de Java 8.
launch.advice.java9=Vous ne pouvez pas lancer Minecraft 1.12 ou version antérieure avec Java 9 ou version ultérieure. Veuillez utiliser Java 8 à la place.
launch.advice.lwjgl_3_4_1=La version actuelle du jeu présente un problème connu pouvant provoquer des saccades en jeu.\nHMCL peut optimiser automatiquement les performances du jeu (à l'aide d'un Java Agent).\nAutorisez-vous HMCL à optimiser automatiquement le jeu ?\nSi vous rencontrez des problèmes, vous pouvez désactiver l'option « Autoriser HMCL à modifier le jeu » dans « Paramètres → Général ».
launch.advice.lwjgl_3_4_1.title=Autoriser HMCL à optimiser automatiquement le jeu ?
launch.advice.modded_java=Certains mods peuvent ne pas être compatibles avec les versions récentes de Java. Il est recommandé d'utiliser Java %1$s pour lancer Minecraft %2$s.
launch.advice.modlauncher8=La version de Forge que vous utilisez n'est pas compatible avec la version actuelle de Java. Veuillez essayer de mettre à jour Forge.
launch.advice.newer_java=Vous utilisez une ancienne version de Java pour lancer le jeu. Il est recommandé de passer à Java 8, faute de quoi certains mods pourraient faire planter le jeu.
launch.advice.not_enough_space=Vous avez alloué une quantité de mémoire supérieure aux %d Mio de mémoire réellement installés sur votre ordinateur. Vous pourriez constater une dégradation des performances, voire être dans l'impossibilité de lancer le jeu.
launch.advice.require_newer_java_version=La version actuelle du jeu requiert Java %s, mais nous n'avons pas pu en trouver. Voulez-vous en télécharger un maintenant ?
launch.advice.too_large_memory_for_32bit=Vous avez alloué une quantité de mémoire supérieure à la limite de mémoire de l'installation Java 32 bits. Vous pourriez être dans l'impossibilité de lancer le jeu.
launch.advice.vanilla_linux_java_8=Minecraft 1.12.2 ou version antérieure ne prend en charge que Java 8 pour la plateforme Linux x86-64, car les versions ultérieures ne peuvent pas charger les bibliothèques natives 32 bits telles que liblwjgl.so\n\nVeuillez le télécharger depuis java.com ou installer OpenJDK 8.
launch.advice.vanilla_x86.translation=Minecraft n'est pas entièrement pris en charge sur votre plateforme, vous pourriez donc rencontrer des fonctionnalités manquantes, voire être dans l'impossibilité de lancer le jeu.\nVous pouvez télécharger Java pour l'architecture <b>x86-64</b> <a href="https://learn.microsoft.com/java/openjdk/download">ici</a> pour une expérience de jeu complète.
