terracotta.confirm.desc=Terracotta est un logiciel libre et open source tiers. Veuillez signaler tout problème rencontré via les canaux appropriés pendant l'utilisation.\nTerracotta utilise la technologie P2P. Après une connexion réussie, les utilisateurs présents dans la salle se connectent directement les uns aux autres, et aucun serveur tiers ne relaie votre trafic. L'expérience multijoueur finale dépend en grande partie des conditions réseau des participants.\nPendant tout le processus multijoueur, vous devez respecter strictement toutes les lois et réglementations de votre pays et de votre région.
