fatal.create_hmcl_current_directory_failure=Cubox ne peut pas créer le répertoire HMCL (%s). Veuillez déplacer HMCL à un autre emplacement et le rouvrir.
fatal.javafx.incomplete=L'environnement JavaFX est incomplet.\nVeuillez essayer de remplacer votre Java ou de réinstaller OpenJFX.
fatal.javafx.missing=Environnement JavaFX manquant. Veuillez ouvrir Cubox avec un Java qui inclut OpenJFX.
fatal.config_change_owner_root=Vous utilisez le compte root pour ouvrir Cubox. Cela pourrait vous empêcher d'ouvrir HMCL avec un autre compte à l'avenir.\nVoulez-vous tout de même continuer ?
fatal.config_in_temp_dir=Vous ouvrez Cubox dans un répertoire temporaire. Vos paramètres et données de jeu pourraient être perdus.\nIl est recommandé de déplacer HMCL à un autre emplacement et de le rouvrir.\nVoulez-vous tout de même continuer ?
fatal.config_loading_failure=Impossible de charger les fichiers de configuration.\nVeuillez vous assurer que Cubox dispose des accès en lecture et en écriture à « %s » ainsi qu'aux fichiers qu'il contient.\nSous macOS, essayez de placer HMCL dans un emplacement disposant d'autorisations différentes de celles du « Bureau », des « Téléchargements » et des « Documents », puis réessayez.
fatal.config_loading_failure.unix=Cubox n'a pas pu charger le fichier de configuration car il a été créé par l'utilisateur « %1$s ».\nVeuillez ouvrir HMCL en tant qu'utilisateur root (non recommandé), ou exécuter la commande suivante dans le terminal pour attribuer la propriété du fichier de configuration à l'utilisateur actuel :\n%2$s
fatal.config_unsupported_version=Le fichier de configuration actuel a été créé par une version plus récente de Cubox, et cette version de HMCL ne peut pas le charger correctement.\nVeuillez mettre à jour et redémarrer HMCL.\nAvant la mise à jour du launcher, aucun des paramètres que vous modifiez ne sera enregistré.
fatal.mac_app_translocation=Cubox a été isolé dans un répertoire temporaire par le système d'exploitation en raison des mécanismes de sécurité de macOS.\nVeuillez déplacer HMCL dans un autre répertoire avant d'essayer de l'ouvrir. Sinon, vos paramètres et données de jeu pourraient être perdus après le redémarrage.\nVoulez-vous tout de même continuer ?
fatal.migration_requires_manual_reboot=Cubox a été mis à jour. Veuillez redémarrer le launcher.
fatal.apply_update_failure=Nous sommes désolés, mais Cubox n'est pas en mesure de se mettre à jour automatiquement.\n\nVous pouvez effectuer la mise à jour manuellement en téléchargeant une version plus récente du launcher depuis %s.\nSi le problème persiste, veuillez envisager de nous le signaler.
fatal.apply_update_need_win7=Cubox ne peut pas se mettre à jour automatiquement sous Windows XP/Vista.\n\nVous pouvez effectuer la mise à jour manuellement en téléchargeant une version plus récente du launcher depuis %s.
fatal.deprecated_java_version=HMCL nécessitera Java 17 ou une version ultérieure pour fonctionner à l'avenir, mais prendra toujours en charge le lancement de jeux avec Java 6 à 16.\n\nIl est recommandé d'installer la dernière version de Java afin de garantir le bon fonctionnement de HMCL.\n\nVous pouvez continuer à conserver l'ancienne version de Java. HMCL peut reconnaître et gérer plusieurs versions de Java et sélectionnera automatiquement le Java approprié pour vous en fonction de la version du jeu.
fatal.deprecated_java_version.update=HMCL nécessitera Java 17 ou une version ultérieure pour fonctionner à l'avenir. Veuillez installer la dernière version de Java afin de garantir que HMCL puisse terminer la mise à jour.\n\nVous pouvez continuer à conserver l'ancienne version de Java. HMCL peut reconnaître et gérer plusieurs versions de Java et sélectionnera automatiquement le Java approprié pour vous en fonction de la version du jeu.
fatal.deprecated_java_version.download_link=Télécharger Java %d
fatal.samba=Si vous avez ouvert Cubox depuis un lecteur réseau Samba, certaines fonctionnalités pourraient ne pas fonctionner. Veuillez essayer de mettre à jour votre Java ou de déplacer le launcher dans un autre répertoire.
fatal.illegal_char=Votre répertoire de travail contient un caractère illégal « = ». Vous ne pourrez pas utiliser authlib-injector ni changer le skin de votre compte hors ligne.
fatal.unsupported_platform=Minecraft n'est pas encore entièrement pris en charge sur votre plateforme, vous pourriez donc rencontrer des fonctionnalités manquantes, voire être dans l'impossibilité de lancer le jeu.\n\nSi vous ne parvenez pas à lancer Minecraft 1.17 et les versions ultérieures, vous pouvez essayer de basculer le « Moteur de rendu » sur « Mesa LLVMpipe » dans « Paramètres globaux/spécifiques à l'instance → Paramètres avancés » afin d'utiliser le rendu par le processeur pour une meilleure compatibilité.
fatal.unsupported_platform.loongarch=Cubox fournit une prise en charge de la plateforme Loongson.\nSi vous rencontrez des problèmes en jouant, vous pouvez ouvrir un ticket sur https://forge.oxitablock.com/Yapix839/Cubox/issues pour obtenir de l'aide.
fatal.unsupported_platform.windows_arm64=Cubox fournit une prise en charge native de la plateforme Windows on Arm. Si vous rencontrez des problèmes en jouant, veuillez essayer de lancer le jeu avec un Java basé sur l'architecture x86.\n\nSi vous utilisez la plateforme <b>Qualcomm</b>, vous devrez peut-être installer le <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL Compatibility Pack</a> avant de jouer.\nCliquez sur le lien pour accéder au Microsoft Store et installer le pack de compatibilité.
fatal.wine_warning=HMCL s'exécute sous Wine ou l'une de ses distributions.\nEn tant qu'application multiplateforme, HMCL offre la meilleure expérience nativement sur votre système d'exploitation hôte.\nAppuyez sur « OK » pour continuer, mais veuillez noter que certains problèmes peuvent survenir.
