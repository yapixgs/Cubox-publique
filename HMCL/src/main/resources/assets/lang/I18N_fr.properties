game.crash.feedback=<b>Veuillez ne pas partager de captures d'écran ou de photos de cette interface avec d'autres personnes !</b> Si vous demandez de l'aide à d'autres personnes, veuillez cliquer sur <b>« Exporter les journaux de plantage »</b> et envoyer le fichier exporté à ces personnes pour analyse.
game.crash.info=Informations sur le plantage
game.crash.reason=Cause du plantage
game.crash.reason.analyzing=Analyse en cours...
game.crash.reason.multiple=Plusieurs causes détectées :\n\n
game.crash.reason.block=Le jeu a planté à cause d'un bloc dans le monde.\n\nVous pouvez essayer de supprimer ce bloc à l'aide des <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">éditeurs de carte</a> ou de supprimer le mod qui l'a ajouté.\n\nType de bloc : %1$s\nEmplacement : %2$s
game.crash.reason.bootstrap_failed=Le jeu a planté à cause du mod « %1$s ».\n\nVous pouvez essayer de le supprimer ou de le mettre à jour.
game.crash.reason.config=Le jeu a planté car le mod « %1$s » n'a pas pu analyser son fichier de configuration « %2$s ».
game.crash.reason.debug_crash=Le jeu a planté car vous l'avez déclenché manuellement. Vous savez donc probablement pourquoi :)
game.crash.reason.duplicated_mod=Le jeu ne peut pas continuer à fonctionner à cause des mods en double « %1$s ».\n\n%2$s\n\nChaque mod ne peut être installé qu'une seule fois. Veuillez supprimer le mod en double et réessayer.
game.crash.reason.entity=Le jeu a planté à cause d'une entité dans le monde.\n\nVous pouvez essayer de supprimer l'entité à l'aide des <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">éditeurs de carte</a> ou de supprimer le mod qui l'a ajoutée.\n\nType d'entité : %1$s\nEmplacement : %2$s
game.crash.reason.modmixin_failure=Le jeu a planté car certains mods n'ont pas pu être injectés.\n\nCela signifie généralement que le mod présente un bug ou est incompatible avec l'environnement actuel.\n\nVous pouvez consulter le journal pour identifier le mod en cause.
game.crash.reason.mod_repeat_installation=Le jeu a planté à cause de mods en double.\n\nChaque mod ne peut être installé qu'une seule fois. Veuillez supprimer le mod en double, puis relancer le jeu.
game.crash.reason.forge_error=Forge/NeoForge a peut-être fourni des informations sur l'erreur.\n\nVous pouvez consulter le journal et effectuer le traitement correspondant en fonction des informations du rapport d'erreur.\n\nSi vous ne voyez pas le message d'erreur, vous pouvez consulter le rapport d'erreur pour comprendre comment l'erreur s'est produite.\n%1$s
game.crash.reason.mod_resolution0=Le jeu a planté à cause de problèmes liés à certains mods. Vous pouvez consulter les journaux pour identifier le ou les mods défaillants.
game.crash.reason.mixin_apply_mod_failed=Le jeu a planté car le mixin n'a pas pu être appliqué au mod « %1$s ».\n\nVous pouvez essayer de supprimer ou de mettre à jour le mod pour résoudre le problème.
game.crash.reason.java_version_is_too_high=Le jeu a planté car la version de Java est trop récente pour continuer à fonctionner.\n\nVeuillez utiliser la version majeure précédente de Java dans « Paramètres globaux/spécifiques à l'instance → Java », puis lancer le jeu.\n\nSinon, vous pouvez la télécharger depuis <a href="https://www.java.com/download/">java.com (Java 8)</a> ou <a href="https://bell-sw.com/pages/downloads/#downloads">BellSoft Liberica Full JRE (Java 17)</a> et d'autres distributions pour en télécharger et en installer une (redémarrez le launcher après l'installation).
game.crash.reason.need_jdk11=Le jeu a planté à cause d'une version de Java inappropriée.\n\nVous devez télécharger et installer Java 11, puis le définir dans « Paramètres globaux/spécifiques à l'instance → Java ».
game.crash.reason.mod_name=Le jeu a planté à cause de problèmes liés aux noms de fichiers des mods.\n\nLes noms de fichiers des mods ne doivent utiliser que des lettres anglaises (A~Z, a~z), des chiffres (0~9), des traits d'union (-), des traits de soulignement (_) et des points (.) en demi-chasse.\n\nVeuillez accéder au répertoire des mods et modifier tous les noms de fichiers de mods non conformes à l'aide des caractères conformes ci-dessus.
game.crash.reason.incomplete_forge_installation=Le jeu ne peut pas continuer à fonctionner à cause d'une installation incomplète de Forge/NeoForge.\n\nVeuillez réinstaller Forge/NeoForge dans « Modifier l'instance → Loaders ».
game.crash.reason.fabric_version_0_12=Fabric Loader 0.12 ou une version ultérieure est incompatible avec les mods actuellement installés. Vous devez le rétrograder vers la version 0.11.7.
game.crash.reason.fabric_warnings=Le Fabric Loader a émis l'avertissement suivant :\n\n%1$s
game.crash.reason.file_already_exists=Le jeu a planté car le fichier « %1$s » existe déjà.\n\nVous pouvez essayer de sauvegarder et de supprimer ce fichier, puis de relancer le jeu.
game.crash.reason.file_changed=Le jeu a planté car la vérification du fichier a échoué.\n\nSi vous avez modifié le fichier Minecraft.jar, vous devrez annuler la modification ou retélécharger le jeu.
game.crash.reason.gl_operation_failure=Le jeu a planté à cause de certains mods, shaders ou packs de ressources/textures.\n\nVeuillez désactiver les mods, shaders ou packs de ressources/textures que vous utilisez, puis réessayer.
game.crash.reason.graphics_driver=Le jeu a planté à cause d'un problème avec votre pilote graphique.\n\nVeuillez réessayer après avoir mis à jour votre pilote graphique vers la dernière version.\n\nSi votre ordinateur dispose d'une carte graphique dédiée, vous devez vérifier si le jeu utilise la carte graphique intégrée. Si c'est le cas, veuillez ouvrir le launcher avec votre carte graphique dédiée. Si le problème persiste, vous devriez probablement envisager d'utiliser une nouvelle carte graphique ou un nouvel ordinateur.\n\nSi vous utilisez votre carte graphique intégrée, veuillez noter que Minecraft 1.16.5 ou une version antérieure nécessite <a href="https://www.oracle.com/java/technologies/javase/javase8-archive-downloads.html">Java 1.8.0_51 ou une version antérieure</a> pour les processeurs Intel(R) Core(TM) série 3000 ou antérieurs.
game.crash.reason.macos_failed_to_find_service_port_for_display=Le jeu ne peut pas continuer car la fenêtre OpenGL sur la plateforme Apple silicon n'a pas pu s'initialiser.\n\nPour ce problème, HMCL ne dispose pas de solution directe pour le moment. Veuillez essayer d'ouvrir un navigateur quelconque et de le passer en plein écran, puis revenez à HMCL, lancez le jeu et <b>retournez rapidement à la page du navigateur</b> avant que la fenêtre du jeu n'apparaisse, attendez que la fenêtre du jeu apparaisse, puis revenez à la fenêtre du jeu.
game.crash.reason.illegal_access_error=Le jeu a planté à cause d'un ou plusieurs mods.\n\nSi vous connaissez ceci : « %1$s », vous pouvez mettre à jour ou supprimer le ou les mods, puis réessayer.
game.crash.reason.install_mixinbootstrap=Le jeu a planté car MixinBootstrap est manquant.\n\nVous pouvez essayer d'installer <a href="https://www.curseforge.com/minecraft/mc-mods/mixinbootstrap">MixinBootstrap</a> pour résoudre le problème. S'il plante après l'installation, essayez d'ajouter un point d'exclamation (!) devant le nom du fichier de ce mod pour tenter de résoudre le problème.
game.crash.reason.optifine_is_not_compatible_with_forge=Le jeu a planté car OptiFine n'est pas compatible avec l'installation actuelle de Forge.\n\nVeuillez accéder au <a href="https://optifine.net/downloads">site officiel d'OptiFine</a>, vérifier si la version de Forge est compatible avec OptiFine, et réinstaller l'instance en respectant strictement la version correspondante, ou changer la version d'OptiFine dans « Modifier l'instance → Loaders ».\n\nAprès des tests, nous estimons que des versions d'OptiFine trop récentes ou trop anciennes peuvent provoquer des plantages.
game.crash.reason.mod_files_are_decompressed=Le jeu a planté car le fichier du mod a été extrait.\n\nVeuillez placer l'intégralité du fichier du mod directement dans le répertoire des mods !\n\nSi l'extraction provoque des erreurs dans le jeu, veuillez supprimer le mod extrait dans le répertoire des mods, puis lancer le jeu.
game.crash.reason.shaders_mod=Le jeu a planté car OptiFine et le mod Shaders sont installés en même temps.\n\nIl suffit de supprimer le mod Shaders car OptiFine prend en charge les shaders de manière native.
game.crash.reason.rtss_forest_sodium=Le jeu a planté car le RivaTuner Statistics Server (RTSS) n'est pas compatible avec Sodium.\n\nCliquez <a href="https://github.com/CaffeineMC/sodium-fabric/wiki/Known-Issues#rtss-incompatible">ici</a> pour plus de détails.
game.crash.reason.too_many_mods_lead_to_exceeding_the_id_limit=Le jeu a planté car vous avez installé trop de mods et dépassé la limite d'ID du jeu.\n\nVeuillez essayer d'installer <a href="https://www.curseforge.com/minecraft/mc-mods/jeid">JEID</a> ou de supprimer quelques mods volumineux.
game.crash.reason.night_config_fixes=Le jeu a planté à cause de problèmes avec Night Config.\n\nVous pouvez essayer d'installer le mod <a href="https://www.curseforge.com/minecraft/mc-mods/night-config-fixes">Night Config Fixes</a>, qui peut vous aider à résoudre ce problème.\n\nPour plus d'informations, consultez le <a href="https://github.com/Fuzss/nightconfigfixes">dépôt GitHub</a> de ce mod.
game.crash.reason.optifine_causes_the_world_to_fail_to_load=Le jeu risque de ne pas pouvoir continuer à cause d'OptiFine.\n\nCe problème ne survient que dans une version spécifique d'OptiFine. Vous pouvez essayer de changer la version d'OptiFine dans « Modifier l'instance → Chargeurs ».
game.crash.reason.jdk_9=Le jeu a planté parce que la version de Java est trop récente pour cette instance.\n\nVous devez télécharger et installer Java 8, puis le sélectionner dans « Paramètres globaux/spécifiques à l'instance → Java ».
game.crash.reason.jvm_32bit=Le jeu a planté parce que l'allocation de mémoire actuelle dépasse la limite de la JVM 32 bits.\n\nSi votre système d'exploitation est en 64 bits, veuillez installer et utiliser une version de Java 64 bits. Sinon, vous devrez peut-être réinstaller un système d'exploitation 64 bits ou vous procurer un ordinateur plus moderne.\n\nVous pouvez aussi désactiver l'option « Allouer automatiquement » dans « Paramètres globaux/spécifiques à l'instance → Mémoire » et définir l'allocation de mémoire maximale à 1024 Mio ou moins.
game.crash.reason.loading_crashed_forge=Le jeu a planté à cause du mod « %1$s » (%2$s).\n\nVous pouvez essayer de le supprimer ou de le mettre à jour.
game.crash.reason.loading_crashed_fabric=Le jeu a planté à cause du mod « %1$s ».\n\nVous pouvez essayer de le supprimer ou de le mettre à jour.
game.crash.reason.mac_jdk_8u261=Le jeu a planté parce que votre version actuelle de Forge ou d'OptiFine est incompatible avec votre installation de Java.\n\nVeuillez essayer de mettre à jour Forge et OptiFine, ou d'utiliser Java 8u251 ou une version antérieure.
game.crash.reason.forge_repeat_installation=Le jeu a planté à cause d'une installation de Forge en double. <a href="https://github.com/HMCL-dev/HMCL/issues/1880">Il s'agit d'un problème connu</a>\n\nIl est recommandé de soumettre un retour sur GitHub accompagné de ce journal afin que nous puissions trouver davantage d'indices et résoudre le problème.\n\nPour l'instant, vous pouvez désinstaller Forge et le réinstaller dans « Modifier l'instance → Chargeurs ».
game.crash.reason.optifine_repeat_installation=Le jeu a planté à cause d'une installation d'OptiFine en double.\n\nVeuillez supprimer OptiFine dans le répertoire des mods ou le désinstaller dans « Modifier l'instance → Chargeurs ».
game.crash.reason.memory_exceeded=Le jeu a planté parce que trop de mémoire a été allouée pour un fichier d'échange trop petit.\n\nVous pouvez essayer de désactiver l'option « Allouer automatiquement » dans « Paramètres globaux/spécifiques à l'instance → Mémoire » et d'ajuster la valeur jusqu'à ce que le jeu se lance.\n\nVous pouvez aussi essayer d'augmenter la taille du fichier d'échange dans les paramètres système.
game.crash.reason.mod=Le jeu a planté à cause du mod « %1$s ».\n\nVous pouvez mettre à jour ou supprimer le mod, puis réessayer.
game.crash.reason.mod_resolution=Le jeu ne peut pas continuer à cause de problèmes de dépendances entre mods.\n\nFabric a fourni les détails suivants :\n\n%1$s
game.crash.reason.forgemod_resolution=Le jeu ne peut pas continuer à cause de problèmes de dépendances entre mods.\n\nForge/NeoForge a fourni les détails suivants :\n%1$s
game.crash.reason.forge_found_duplicate_mods=Le jeu a planté à cause d'un problème de mod en double. Forge/NeoForge a fourni les informations suivantes :\n%1$s
game.crash.reason.mod_resolution_collection=Le jeu a planté parce que la version du mod n'est pas compatible.\n\n« %1$s » nécessite le mod « %2$s ».\n\nVous devez mettre à niveau ou rétrograder « %3$s » avant de continuer.
game.crash.reason.mod_resolution_conflict=Le jeu a planté à cause de mods en conflit.\n\n« %1$s » est incompatible avec « %2$s ».
game.crash.reason.mod_resolution_missing=Le jeu a planté parce que certains mods dépendants n'étaient pas installés.\n\n« %1$s » nécessite le mod « %2$s ».\n\nCela signifie que vous devez d'abord télécharger et installer « %2$s » pour pouvoir continuer à jouer.
game.crash.reason.mod_resolution_missing_minecraft=Le jeu a planté parce qu'un mod est incompatible avec la version actuelle de Minecraft.\n\n« %1$s » nécessite la version %2$s de Minecraft.\n\nSi vous souhaitez jouer avec cette version du mod installée, vous devez changer la version du jeu de votre instance.\n\nSinon, vous devez installer une version compatible avec cette version de Minecraft.
game.crash.reason.mod_resolution_mod_version=%1$s (Version : %2$s)
game.crash.reason.mod_resolution_mod_version.any=%1$s (N'importe quelle version)
game.crash.reason.modlauncher_8=Le jeu a planté parce que votre version actuelle de Forge n'est pas compatible avec votre installation de Java. Veuillez essayer de mettre à jour Forge.
game.crash.reason.no_class_def_found_error=Le jeu ne peut pas continuer à cause de code incomplet.\n\nIl manque « %1$s » à votre instance de jeu. Cela peut être dû à un mod manquant, à un mod incompatible installé ou à des fichiers corrompus.\n\nVous devrez peut-être réinstaller le jeu et tous les mods, ou demander de l'aide à quelqu'un.
game.crash.reason.no_such_method_error=Le jeu ne peut pas continuer à cause de code incomplet.\n\nIl manque peut-être un mod à votre instance de jeu, un mod incompatible est peut-être installé, ou certains fichiers sont peut-être corrompus.\n\nVous devrez peut-être réinstaller le jeu et tous les mods, ou demander de l'aide à quelqu'un.
game.crash.reason.opengl_not_supported=Le jeu a planté parce que votre pilote graphique ne prend pas en charge OpenGL.\n\nSi vous diffusez le jeu sur Internet ou utilisez un environnement de bureau à distance, veuillez jouer au jeu sur votre machine locale.\n\nVous pouvez aussi mettre à jour votre pilote graphique vers la dernière version, puis réessayer.\n\nSi votre ordinateur dispose d'une carte graphique dédiée, veuillez vous assurer que le jeu l'utilise bien pour le rendu. Si le problème persiste, envisagez de vous procurer une nouvelle carte graphique ou un nouvel ordinateur.
game.crash.reason.openj9=Le jeu ne peut pas fonctionner sur une JVM OpenJ9. Veuillez passer à un Java utilisant la JVM Hotspot dans « Paramètres globaux/spécifiques à l'instance → Java » et relancer le jeu. Si vous n'en avez pas, vous pouvez en télécharger un.
game.crash.reason.out_of_memory=Le jeu a planté parce que l'ordinateur a manqué de mémoire.\n\nIl n'y a peut-être pas assez de mémoire disponible ou trop de mods installés. Vous pouvez essayer de résoudre ce problème en augmentant la mémoire allouée dans « Paramètres globaux/spécifiques à l'instance → Mémoire ».\n\nSi ces problèmes persistent, vous aurez peut-être besoin d'un meilleur ordinateur.
game.crash.reason.resolution_too_high=Le jeu a planté parce que la résolution du pack de ressources/textures est trop élevée.\n\nVous devriez passer à un pack de ressources/textures de résolution inférieure ou envisager d'acheter une meilleure carte graphique avec plus de VRAM.
game.crash.reason.stacktrace=La raison du plantage est inconnue. Vous pouvez consulter ses détails en cliquant sur « Journaux ».\n\nCertains mots-clés peuvent contenir des noms de mods. Vous pouvez les rechercher en ligne pour identifier le problème par vous-même.\n\n%s
game.crash.reason.too_old_java=Le jeu a planté parce que vous utilisez une version obsolète de Java.\n\nVous devez passer à une version plus récente de Java (%1$s) dans « Paramètres globaux/spécifiques à l'instance → Java », puis relancer le jeu. Vous pouvez télécharger Java <a href="https://learn.microsoft.com/java/openjdk/download">ici</a>.
game.crash.reason.unknown=Nous ne parvenons pas à déterminer la raison du plantage du jeu. Veuillez vous référer aux journaux du jeu.
game.crash.reason.unsatisfied_link_error=Échec du lancement de Minecraft à cause de bibliothèques manquantes : %1$s.\n\nSi vous avez modifié le chemin des bibliothèques natives, veuillez vous assurer que ces bibliothèques existent bien. Sinon, essayez de relancer après l'avoir rétabli à sa valeur par défaut.\n\nSi vous ne l'avez pas modifié, veuillez vérifier que vous n'avez pas de mods de dépendance manquants.\n\nDans le cas contraire, si vous pensez que ce problème est causé par HMCL, veuillez nous faire part de vos retours.
