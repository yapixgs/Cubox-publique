# Référentiel Cloudox (R8.1, R8.3, R8.6) — fichier canonique, ne pas modifier : `normes synchro` le réécrit.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DOCKER_HOST: tcp://172.17.0.1:2375
  FORGEJO_TOKEN: ${{ github.token }}
  # Lecture des registres de paquets Cloudox (cloudox-socle, @cloudox/socle).
  UV_INDEX_CLOUDOX_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USER }}
  UV_INDEX_CLOUDOX_PASSWORD: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
  CLOUDOX_NPM_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

jobs:
  conformite:
    name: conformite
    runs-on: cloudox
    container:
      image: forge.oxitablock.com/cloudox/normes:v2.0.0
      credentials:
        username: ${{ secrets.FORGEJO_REGISTRY_USER }}
        password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with: {fetch-depth: 0}
      - run: just conformite

  qualite:
    name: qualite
    runs-on: cloudox
    container:
      image: forge.oxitablock.com/cloudox/normes:v2.0.0
      credentials:
        username: ${{ secrets.FORGEJO_REGISTRY_USER }}
        password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: just qualite

  tests:
    name: tests
    runs-on: cloudox
    container:
      image: forge.oxitablock.com/cloudox/normes:v2.0.0
      credentials:
        username: ${{ secrets.FORGEJO_REGISTRY_USER }}
        password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: just tests

  e2e:
    name: e2e
    runs-on: cloudox
    container:
      image: forge.oxitablock.com/cloudox/normes:v2.0.0
      credentials:
        username: ${{ secrets.FORGEJO_REGISTRY_USER }}
        password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: just e2e

  construction:
    name: construction
    runs-on: cloudox
    container:
      image: forge.oxitablock.com/cloudox/normes:v2.0.0
      credentials:
        username: ${{ secrets.FORGEJO_REGISTRY_USER }}
        password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - run: just construction
