# Référentiel Cloudox (R8.1, R8.5, R8.6) — fichier canonique, ne pas modifier : `normes synchro` le réécrit.
# Les jobs tournent sur le runner blue, sans conteneur : l'environnement vient de flake.nix (R8.6).
name: Livraison

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: livraison
  cancel-in-progress: false

env:
  # Le jeton du bot pour l'API de la forge (Releases, PR de mise en prod, signalements).
  # Pas FORGEJO_TOKEN : le runner blue l'écrase avec le jeton du job, refusé par l'API.
  JETON_FORGE: ${{ secrets.CLOUDOX_BOT_TOKEN }}
  # Lecture des registres de paquets Cloudox (cloudox-normes, cloudox-socle, @cloudox/socle).
  UV_INDEX_CLOUDOX_USERNAME: ${{ secrets.FORGEJO_REGISTRY_USER }}
  UV_INDEX_CLOUDOX_PASSWORD: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
  CLOUDOX_NPM_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

jobs:
  version:
    name: version
    runs-on: blue
    outputs:
      version: ${{ steps.suivante.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
        with: {fetch-depth: 0}
      - id: suivante
        # L'affectation d'abord : un échec de `just version` arrête le job au lieu de
        # passer pour « rien à livrer ».
        run: |
          version="$(nix develop --command just version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  images:
    name: images
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: blue
    steps:
      - uses: actions/checkout@v4.2.2
      - run: nix develop --command just images "${{ needs.version.outputs.version }}"
        env:
          # Les images vont dans Zot (R9.1, R9.2) ; les paquets des bibliothèques et de
          # l'outil normes, dans les registres de paquets de la forge (R3.5).
          REGISTRY_USER: ${{ secrets.ZOT_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.ZOT_REGISTRY_TOKEN }}
          PAQUETS_USER: ${{ secrets.FORGEJO_REGISTRY_USER }}
          PAQUETS_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

  publication:
    name: publication
    needs: [version, images]
    runs-on: blue
    steps:
      - uses: actions/checkout@v4.2.2
        with: {fetch-depth: 0}
      - run: nix develop --command just publication "${{ needs.version.outputs.version }}"

  deploiement:
    name: deploiement
    needs: [version, publication]
    runs-on: blue
    steps:
      - uses: actions/checkout@v4.2.2
      - run: nix develop --command just deploiement "${{ needs.version.outputs.version }}"
        env:
          JETON_FORGE: ${{ secrets.CLOUDOX_BOT_TOKEN }}
          REGISTRY_USER: ${{ secrets.ZOT_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.ZOT_REGISTRY_TOKEN }}
