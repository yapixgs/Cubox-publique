# Miroir public de Cubox (ADR-0041 d'infra) — dérogation R8.1 permanente de cloudox.toml.
#
# La forge refuse l'accès anonyme : chaque version doit aussi partir sur
# github.com/yapixgs/Cubox-publique, sinon personne ne peut la télécharger. Ce travail
# exige deux secrets que les workflows canoniques ne transmettent pas (GH_MIRROR_TOKEN,
# ARCH_SIGNING_KEY) : d'où ce troisième workflow. Il tourne sur le runner blue, sans
# conteneur : makepkg vient de pacman (nixpkgs), voir `just miroir`.
#
# Lancé par la livraison (`just publication` → packaging/publier-forge.sh) une fois la
# Release de la forge complète ; à la main pour republier une version. Toute la logique
# est dans le justfile (`just miroir`), comme pour la CI (R8.2).
name: Miroir

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version publiée à miroiter (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: miroir
  cancel-in-progress: false

jobs:
  miroir:
    name: miroir
    runs-on: blue
    steps:
      # Clone complet : le paquet pacman tire sa version et son code des tags.
      - uses: actions/checkout@v4.2.2
        with: {fetch-depth: 0}

      # Jeton du bot pour télécharger et ajouter les pièces jointes de la version (le jeton
      # du job est refusé par l'API depuis ce runner).
      - name: Publier sur le miroir
        run: nix develop --command just miroir "${{ github.event.inputs.version }}"
        env:
          JETON_FORGE: ${{ secrets.CLOUDOX_BOT_TOKEN }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}

      # R8.7 : un échec se signale en ticket, avec la fin de sa sortie.
      - name: Signaler l'échec
        if: failure()
        env:
          TOKEN: ${{ secrets.CLOUDOX_BOT_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        # Le runner n'a pas jq : le corps JSON vient de Python.
        run: |
          python3 -c 'import json, os; print(json.dumps({"title": "Échec du miroir public — " + os.environ["VERSION"], "body": "Le workflow Miroir a échoué pour " + os.environ["VERSION"] + " : " + os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_NUMBER"]}))' \
          | curl -sS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/issues" >/dev/null
