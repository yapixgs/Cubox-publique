---
name: Image — site de téléchargement

# Construit et publie l'image OCI de cubox.yabox.wasabout.net.
#
# Ce workflow ne construit QUE notre propre code (le site). Le launcher, lui,
# n'est pas une image de conteneur : c'est release.yml qui produit ses paquets.
# Règle 4 de Cloudox/infra/AGENTS.md — aucun miroir d'image tierce.
#
# DÉCLENCHEMENT
#   push main   -> :main + :main-<sha8>
#   tag vX.Y    -> :vX.Y
#   manuel      -> tag explicite
#
# Volontairement PAS de tag `latest` : un tag flottant fait qu'un simple
# redémarrage de pod peut embarquer une version que personne n'a décidée.
# Les manifestes d'infra épinglent de toute façon un digest (règle 5).
#
# SECRETS REQUIS (secrets d'ORGANISATION Cloudox)
#   FORGEJO_REGISTRY_USER / FORGEJO_REGISTRY_TOKEN
#
# Le jeton automatique de la CI NE PEUT PAS pousser dans le registre de
# paquets Forgejo — limite amont documentée (forgejo#3571, #6904, #1296) que
# `permissions: packages: write` ne contourne pas. Il faut un jeton personnel
# de portée `write:package`, sur un compte ayant les droits sur le namespace
# `cloudox` lui-même (sinon `reqPackageAccess`, forgejo#7352).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'image à publier (ex. v1.3)"
        required: true
        type: string

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build & push (site)
    runs-on: docker
    container:
      image: docker:24-cli
    env:
      # SANS CETTE LIGNE, RIEN NE MARCHE. Le client docker de ce conteneur
      # vise par défaut unix:///var/run/docker.sock, absent ici : le daemon
      # vit dans le sidecar dind du pod du runner, joignable sur la passerelle
      # du bridge. `docker_host` côté runner ne suffit pas — il dit seulement
      # au runner OÙ créer les conteneurs. Les deux sont nécessaires.
      DOCKER_HOST: tcp://172.17.0.1:2375
      IMG: forge.oxitablock.com/cloudox/cubox-site
    steps:
      - name: Outils de base
        run: apk add --no-cache git curl

      # `actions/checkout@v4` ne fonctionne PAS dans un job conteneurisé sur ce
      # runner. Bissection du 26/09/2026, 13 jobs sonde : sans conteneur il
      # passe ; avec conteneur il échoue sur debian, eclipse-temurin ET
      # docker:24-cli (ni l'image ni la libc ne sont donc en cause) ; un clone
      # manuel dans le même conteneur passe. D'où ces quelques lignes.
      - name: Récupérer le dépôt
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init -q .
          git config --global --add safe.directory "$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          entete="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$entete" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Déterminer les tags
        id: tags
        shell: sh
        run: |
          set -eu
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          PRIMARY=""
          EXTRA=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              PRIMARY='${{ github.event.inputs.tag }}'
              ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/v*)     PRIMARY="${GITHUB_REF##refs/tags/}" ;;
                refs/heads/main)  PRIMARY="main"; EXTRA="main-$SHORT_SHA" ;;
                *) echo "::error::déclenchement sur une ref inattendue : $GITHUB_REF"; exit 1 ;;
              esac
              ;;
          esac
          echo "PRIMARY=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "EXTRA=$EXTRA"     >> "$GITHUB_OUTPUT"
          echo "publiera : cubox-site:$PRIMARY"

      - name: Connexion au registre Forgejo
        env:
          REG_USER: ${{ secrets.FORGEJO_REGISTRY_USER }}
          REG_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${REG_USER:-}" ] || [ -z "${REG_TOKEN:-}" ]; then
            echo "::error::secrets FORGEJO_REGISTRY_USER / _TOKEN absents."
            echo "::error::Le jeton automatique de la CI ne peut PAS pousser dans"
            echo "::error::le registre Forgejo (limite amont #3571). Créer un jeton"
            echo "::error::de portée write:package et le déclarer en secrets"
            echo "::error::d organisation Cloudox."
            exit 1
          fi
          echo "$REG_TOKEN" | docker login forge.oxitablock.com -u "$REG_USER" --password-stdin

      - name: Construire l'image
        env:
          PRIMARY: ${{ steps.tags.outputs.PRIMARY }}
          EXTRA: ${{ steps.tags.outputs.EXTRA }}
        run: |
          set -eu
          docker pull "$IMG:main" 2>/dev/null || true
          TAGS="--tag $IMG:$PRIMARY"
          [ -n "$EXTRA" ] && TAGS="$TAGS --tag $IMG:$EXTRA"
          # Le contexte est la RACINE du dépôt : site/Dockerfile reprend le
          # logo déjà versionné dans HMCL/image/ plutôt que d'en dupliquer une
          # copie qui divergerait.
          # shellcheck disable=SC2086
          docker build \
            --pull \
            --file site/Dockerfile \
            $TAGS \
            --cache-from "$IMG:main" \
            --label "org.opencontainers.image.source=https://forge.oxitablock.com/Cloudox/Cubox" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$PRIMARY" \
            .

      - name: Test de fumée
        env:
          PRIMARY: ${{ steps.tags.outputs.PRIMARY }}
        run: |
          set -u
          # Même mécanique que ci.yml : la sortie est capturée dans un fichier,
          # et le succès passe par un témoin plutôt que par le code de retour
          # (la sortie traverse un `tee`, et ash n'a pas `pipefail` partout).
          rm -f /tmp/smoke.ok
          fumee() {
            set -x
            NOM="smoke-site-$$"
            docker run --rm -d --name "$NOM" "$IMG:$PRIMARY" || return 1

            ok=0
            i=0
            while [ "$i" -lt 15 ]; do
              if docker exec "$NOM" wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                ok=1; break
              fi
              i=$((i + 1))
              sleep 2
            done

            if [ "$ok" = "1" ]; then
              docker exec "$NOM" wget -qO- http://127.0.0.1:8080/ | grep -q 'Cubox' \
                || { echo "ECHEC: la page ne contient pas 'Cubox'"; ok=0; }
              # Une variable non substituée laisse nginx démarrer mais casse le
              # relais : panne silencieuse, exactement ce qu'on veut attraper.
              if docker exec "$NOM" grep -q 'CUBOX_RELEASES_BASE' /etc/nginx/conf.d/default.conf; then
                echo "ECHEC: variables CUBOX_* non substituées"
                ok=0
              fi
              # Le namespace applique `restricted` : un pod root serait refusé
              # à l'admission. Autant le voir ici plutôt que dans Argo.
              uid="$(docker exec "$NOM" id -u)"
              [ "$uid" = "10001" ] || { echo "ECHEC: UID $uid au lieu de 10001"; ok=0; }
            else
              echo "ECHEC: l image ne répond pas en 30 s"
            fi

            docker logs "$NOM" 2>&1 | tail -20 || true
            docker stop "$NOM" >/dev/null 2>&1 || true
            [ "$ok" = "1" ] && touch /tmp/smoke.ok
            return 0
          }
          fumee 2>&1 | tee /tmp/smoke.log
          if [ -f /tmp/smoke.ok ]; then
            echo "test de fumée OK"
          else
            echo "::error::test de fumée en échec"
            tail -n 40 /tmp/smoke.log
            exit 1
          fi

      - name: Publier sur la forge
        id: push
        env:
          PRIMARY: ${{ steps.tags.outputs.PRIMARY }}
          EXTRA: ${{ steps.tags.outputs.EXTRA }}
        run: |
          set -eu
          docker push "$IMG:$PRIMARY"
          [ -n "$EXTRA" ] && docker push "$IMG:$EXTRA" || true
          # Le digest est ce qu'il faut épingler dans Cloudox/infra (règle 5 :
          # aucun tag flottant dans les manifestes). L'afficher ici évite un
          # aller-retour manuel pour aller le chercher.
          # `index .RepoDigests 0` échoue durement quand la liste est vide —
          # ce qui arrive avec le magasin d'images containerd et les manifestes
          # d'attestation produits par buildx. L'image est DÉJÀ poussée à ce
          # stade : perdre la publication parce qu'on n'a pas su lire le digest
          # serait absurde. On tente deux façons, puis on laisse vide.
          DIGEST="$(docker inspect --format='{{join .RepoDigests "\n"}}' "$IMG:$PRIMARY" 2>/dev/null | head -n1)"
          if [ -z "$DIGEST" ]; then
            DIGEST="$(docker buildx imagetools inspect "$IMG:$PRIMARY" 2>/dev/null \
                      | awk '/^Digest:/ {print $2}' | head -n1)"
            [ -n "$DIGEST" ] && DIGEST="$IMG@$DIGEST"
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest : ${DIGEST:-<illisible, voir la page du paquet sur la forge>}"

      # Copie dans Zot, le registre du cluster. Le chemin reprend
      # `forge.oxitablock.com/...` À L'IDENTIQUE : containerd est configuré
      # pour chercher ce préfixe exact dans Zot (bootstrap/25-registries.sh).
      # Un autre chemin rendrait la copie invisible. Les manifestes continuent
      # de pointer vers la forge : Zot n'est donc pas un point de défaillance
      # unique, juste un cache.
      - name: Copier dans Zot
        continue-on-error: true
        env:
          PRIMARY: ${{ steps.tags.outputs.PRIMARY }}
          EXTRA: ${{ steps.tags.outputs.EXTRA }}
          ZOT_USER: ${{ secrets.ZOT_REGISTRY_USER }}
          ZOT_TOKEN: ${{ secrets.ZOT_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${ZOT_TOKEN:-}" ]; then
            echo "::warning::secrets ZOT_REGISTRY_* absents — copie ignorée"
            exit 0
          fi
          ZOT=10.43.92.168:5000
          DST="$ZOT/forge.oxitablock.com/cloudox/cubox-site"
          echo "$ZOT_TOKEN" | docker login "$ZOT" -u "$ZOT_USER" --password-stdin
          for T in $PRIMARY $EXTRA; do
            docker tag "$IMG:$T" "$DST:$T"
            docker push "$DST:$T"
          done
          docker logout "$ZOT" || true
          # Best-effort ne veut pas dire silencieux : sans cette trace, un
          # échec de copie laisse le job au vert et personne ne s'aperçoit que
          # le cache n'a rien reçu.
          echo "ZOT_COPIE=ok" >> "$GITHUB_ENV"

      - name: Déconnexion
        if: always()
        run: docker logout forge.oxitablock.com || true

      - name: Récapitulatif
        env:
          PRIMARY: ${{ steps.tags.outputs.PRIMARY }}
          DIGEST: ${{ steps.push.outputs.DIGEST }}
        run: |
          if [ "${ZOT_COPIE:-}" = "ok" ]; then
            ZOT_LIGNE="- copie dans Zot (cache du cluster) : ✅"
          else
            ZOT_LIGNE="- copie dans Zot : ⚠️ ÉCHOUÉE — les pods tireront depuis la forge"
          fi
          {
            echo "## ✅ Image publiée"
            echo ""
            echo "- \`$IMG:$PRIMARY\`"
            echo "$ZOT_LIGNE"
            echo ""
            echo "### À épingler dans \`Cloudox/infra\`"
            echo ""
            echo "\`tenants/cubox/cubox.yaml\` → \`image:\` :"
            echo ""
            echo "\`\`\`"
            echo "$DIGEST"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
